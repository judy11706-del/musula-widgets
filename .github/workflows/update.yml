name: Aktualizacja opinii i Instagrama

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Opinie Google
        run: node scripts/update-opinie.mjs
      - name: Instagram (Behold)
        run: node scripts/update-instagram.mjs
        env:
          BEHOLD_FEED_ID: ${{ vars.BEHOLD_FEED_ID }}
      - name: Zapisz zmiany
        run: |
          git config user.name "musula-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Aktualizacja danych $(date -u +%F)"
          git push
